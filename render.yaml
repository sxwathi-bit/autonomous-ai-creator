services:
  # Persistent Backend Service with Autonomous Worker Loop
  - type: web
    name: autonomous-ai-creator-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_MODE
        value: "false"
      - key: PORT
        value: 3000
      - key: MIN_PUBLISH_INTERVAL_MINUTES
        value: "180"
      - key: MAX_PUBLISH_INTERVAL_MINUTES
        value: "420"
      - key: EDITORIAL_THRESHOLD
        value: "65"
      - key: DATABASE_URL
        fromDatabase:
          name: autonomous-creator-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false

databases:
  # Managed PostgreSQL Database
  - name: autonomous-creator-db
    plan: free
    databaseName: autonomous_creator
    user: postgres
