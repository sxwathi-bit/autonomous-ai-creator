version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: autonomous_creator_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: autonomous_creator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autonomous_creator"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autonomous_creator_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DEV_MODE: "false"
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/autonomous_creator?schema=public"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      TAVILY_API_KEY: "${TAVILY_API_KEY}"
      WEB_ORIGIN: "http://localhost:3000"
      MIN_PUBLISH_INTERVAL_MINUTES: "180"
      MAX_PUBLISH_INTERVAL_MINUTES: "420"
      EDITORIAL_THRESHOLD: "65"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
